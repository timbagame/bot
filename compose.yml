services:
  bot:
    image: ghcr.io/timbagame/bot:main
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      SOLANA_NETWORK: ${SOLANA_NETWORK}
      MNEMONIC_FILE: /run/secrets/bot_mnemonic
      ADMIN_KEYPAIR_PATH: /run/secrets/admin_keypair.json
      ORACLE_API_URL: ${ORACLE_API_URL:-http://oracle:3001}
      ORACLE_API_TOKEN_FILE: /run/secrets/oracle_api_token
    volumes:
      # Read-only keypair for on-chain interactions
      - ./admin-keypair.json:/run/secrets/admin_keypair.json:ro,Z
      - ./secrets/bot-mnemonic:/run/secrets/bot_mnemonic:ro,Z
      - ./secrets/oracle-api-token:/run/secrets/oracle_api_token:ro,Z
      # Persist local sqlite databases between restarts
      - ./chat-settings.sqlite:/app/chat-settings.sqlite:Z
      - ./games.sqlite:/app/games.sqlite:Z
      - ./tokens.sqlite:/app/tokens.sqlite:Z
    networks:
      - timba
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - const response = await fetch('http://127.0.0.1:3002/health'); if (!response.ok) process.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  timba:
    name: timba
    external: true
