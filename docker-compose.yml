services:
  app:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      SOLANA_NETWORK: ${SOLANA_NETWORK}
      MNEMONIC: ${MNEMONIC}
      ORACLE_API_URL: ${ORACLE_API_URL:-http://host.docker.internal:3001}
      TOKEN_MINT: ${TOKEN_MINT}
      TICKER: ${TICKER}
