version: 2
# GitHub Packages uses automatic GITHUB_TOKEN authentication and package Read grants.
updates:
  - package-ecosystem: bun
    assignees: [astrovm]
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    assignees: [astrovm]
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    assignees: [astrovm]
    directory: /
    schedule:
      interval: weekly
