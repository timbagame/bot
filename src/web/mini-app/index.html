<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Wallet Manager</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      color: var(--tg-theme-text-color, #000);
      background-color: var(--tg-theme-bg-color, #fff);
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1,
    h2 {
      color: var(--tg-theme-text-color, #000);
    }

    .button {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .hidden {
      display: none;
    }

    .wallet-info {
      word-break: break-all;
      font-size: 14px;
    }

    .balance {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Solana Wallet Manager</h1>

    <div id="loading-screen" class="card">
      <p>Loading your wallet information...</p>
    </div>

    <div id="create-wallet-screen" class="card hidden">
      <h2>Create a New Wallet</h2>
      <p>You don't have a wallet yet. Create one to get started.</p>

      <div class="input-group">
        <label for="password">Password (to encrypt your private key)</label>
        <input type="password" id="password" placeholder="Enter a secure password">
      </div>

      <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm your password">
      </div>

      <button id="create-wallet-btn" class="button">Create Wallet</button>
    </div>

    <div id="wallet-screen" class="card hidden">
      <h2>Your Wallet</h2>

      <div class="wallet-info">
        <p><strong>Public Key:</strong> <span id="public-key"></span></p>
        <p><strong>Balance:</strong> <span id="balance" class="balance">0 SOL</span></p>
      </div>

      <button id="request-airdrop-btn" class="button">Request Airdrop (1 SOL)</button>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Elements
    const loadingScreen = document.getElementById('loading-screen');
    const createWalletScreen = document.getElementById('create-wallet-screen');
    const walletScreen = document.getElementById('wallet-screen');
    const publicKeyElement = document.getElementById('public-key');
    const balanceElement = document.getElementById('balance');
    const createWalletBtn = document.getElementById('create-wallet-btn');
    const requestAirdropBtn = document.getElementById('request-airdrop-btn');

    // API endpoint (will be set by the server)
    const API_BASE_URL = window.location.origin;

    // Check if user has a wallet
    async function checkWallet() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/wallet`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Telegram-Data': tg.initData
          }
        });

        const data = await response.json();

        if (data.success && data.wallet) {
          // User has a wallet
          publicKeyElement.textContent = data.wallet.publicKey;
          balanceElement.textContent = `${data.wallet.balance} SOL`;

          loadingScreen.classList.add('hidden');
          walletScreen.classList.remove('hidden');
        } else {
          // User doesn't have a wallet
          loadingScreen.classList.add('hidden');
          createWalletScreen.classList.remove('hidden');
        }
      } catch (error) {
        console.error('Error checking wallet:', error);
        alert('Failed to load wallet information. Please try again.');
      }
    }

    // Create a new wallet
    async function createWallet() {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!password) {
        alert('Please enter a password');
        return;
      }

      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/wallet/create`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Telegram-Data': tg.initData
          },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (data.success) {
          publicKeyElement.textContent = data.publicKey;
          balanceElement.textContent = '0 SOL';

          createWalletScreen.classList.add('hidden');
          walletScreen.classList.remove('hidden');

          tg.showAlert('Wallet created successfully!');
        } else {
          alert(data.error || 'Failed to create wallet');
        }
      } catch (error) {
        console.error('Error creating wallet:', error);
        alert('Failed to create wallet. Please try again.');
      }
    }

    // Request an airdrop
    async function requestAirdrop() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/wallet/airdrop`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Telegram-Data': tg.initData
          },
          body: JSON.stringify({ amount: 1 })
        });

        const data = await response.json();

        if (data.success) {
          balanceElement.textContent = `${data.balance} SOL`;
          tg.showAlert('Airdrop successful!');
        } else {
          alert(data.error || 'Failed to request airdrop');
        }
      } catch (error) {
        console.error('Error requesting airdrop:', error);
        alert('Failed to request airdrop. Please try again.');
      }
    }

    // Event listeners
    createWalletBtn.addEventListener('click', createWallet);
    requestAirdropBtn.addEventListener('click', requestAirdrop);

    // Initialize
    checkWallet();
  </script>
</body>

</html>
